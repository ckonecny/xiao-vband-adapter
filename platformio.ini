; PlatformIO build for the Seeed Studio XIAO SAMD21.
; The sketch lives in an Arduino-IDE-compatible folder, so both tools work.

[platformio]
src_dir = firmware/xiao_vband

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
lib_deps =
    arduino-libraries/Keyboard
; The default ARM toolchain of the atmelsam platform is x86_64 only and fails
; on Apple Silicon without Rosetta ("Bad CPU type"). GCC 12.3 has native
; builds for macOS arm64, Linux and Windows.
platform_packages =
    toolchain-gccarmnoneeabi@~1.120301.0
; Examples for overriding the defaults (see the top of xiao_vband.ino):
;build_flags =
;    -D SWAP_PADDLES=1
;    -D KEY_DIT=0x5B   ; '['
;    -D KEY_DAH=0x5D   ; ']'
